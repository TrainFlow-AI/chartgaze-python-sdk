[project]
name = "chartgaze"
version = "0.1.0"
description = "ChartGaze by TrainFlow AI — Python SDK for market structure, events, and accounts. For full autonomy use trainflow.dev"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "TrainFlow AI" }]
dependencies = ["requests>=2.28.0", "python-dotenv>=1.0.0"]

[project.urls]
Homepage = "https://chartgaze.live"
Repository = "https://github.com/TrainFlow-AI/chartgaze-python-sdk"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["chartgaze*"]
